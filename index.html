
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080f1d">

    <meta name="description"
        content="RAID massivlari, RAID 0, RAID 1, RAID 5, RAID 6 va ma'lumotlarni saqlash texnologiyalarini interaktiv o'rganish.">

    <meta name="author"
        content="Muhammadjonov Mutaljon, Anvarov Asadbek">

    <meta name="keywords"
        content="RAID, RAID 0, RAID 1, RAID 5, RAID 6, RAID 10, HDD, SSD, NVMe, NAS, SAN, ma'lumotlarni saqlash">

    <title>RAID PREMIUM | Ma'lumotlarni saqlash texnologiyalari</title>

    <!-- Asosiy dizayn -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Animatsiyalar -->
    <link rel="stylesheet" href="css/animations.css">

    <!-- Telefon va planshet uchun moslashuv -->
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- =====================================
         1. KIRISH SAHIFASI
    ====================================== -->

    <section
        id="heroSection"
        class="hero-section"
        aria-label="RAID PREMIUM kirish sahifasi"
    >

        <div class="hero-container">

            <!-- Yuqori belgi -->
            <div class="hero-badge">
                <span class="status-dot"></span>
                TECHNOLOGY PRESENTATION
            </div>

            <!-- Logo -->
            <div class="hero-logo">
                RAID
            </div>

            <!-- Asosiy sarlavha -->
            <h1 class="hero-title">
                RAID <span>PREMIUM</span>
            </h1>

            <!-- Loyiha haqida -->
            <p class="hero-description">
                RAID massivlari va ma'lumotlarni saqlash
                texnologiyalarini interaktiv o'rganish
            </p>

            <!-- Mualliflar -->
            <div class="authors-section">

                <h3 class="authors-title">
                    MUALLIFLAR
                </h3>

                <div class="authors-container">

                    <div class="author-card">
                        <strong>Muhammadjonov Mutaljon</strong>
                    </div>

                    <div class="author-card">
                        <strong>Anvarov Asadbek</strong>
                    </div>

                </div>

            </div>

            <!-- Boshlash tugmasi -->
            <button
                id="startBtn"
                class="hero-button"
                type="button"
                aria-label="Taqdimotni boshlash"
            >
                Taqdimotni boshlash
                <span class="button-arrow">→</span>
            </button>

            <!-- Pastki yozuv -->
            <div class="hero-footer">
                <span></span>

                INTERACTIVE TECHNOLOGY PRESENTATION

                <span></span>
            </div>

        </div>

    </section>


    <!-- =====================================
         2. TAQDIMOT SLAYDLARI
         Slaydlar JavaScript orqali yuklanadi
    ====================================== -->

    <main
        id="presentation"
        class="hidden"
        aria-label="RAID PREMIUM taqdimoti"
    >
        <!-- slides.js va script.js orqali yaratiladi -->
    </main>


    <!-- =====================================
         3. JAVASCRIPT FAYLLARI
         MUHIM: Tartibni o'zgartirmang!
    ====================================== -->

    <!-- 1. Slayd ma'lumotlari -->
    <script src="css/js/slides.js"></script>

    <!-- 2. Animatsiyalar -->
    <script src="css/js/animations.js"></script>

    <!-- 3. Asosiy boshqaruv va test tizimi -->
    <script src="css/js/script.js"></script>


    <!-- =====================================
         4. JAVASCRIPT O'CHIRILGAN HOLAT
    ====================================== -->

    <noscript>
        <div style="
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            color: white;
            background: #080f1d;
            font-family: Arial, sans-serif;
        ">
            Ushbu taqdimotni ishlatish uchun
            brauzeringizda JavaScript yoqilgan bo'lishi kerak.
        </div>
    </noscript>

</body>

</html>
